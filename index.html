<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Smile · Redirection</title>
    <meta http-equiv="refresh" content="0; url=intro.html">
    <script>
        // Rediriger vers l'intro pour une expérience premium
        window.location.href = "intro.html";
    </script>
    <style>
        :root {
            --bg: #09080F;
            --surface: rgba(18, 16, 30, 0.88);
            --text: #EDE9F9;
            --text-muted: #B4B0CC;
            --violet: #8B5CF6;
            --gold: #F59E0B;
            --border: rgba(124, 58, 237, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
            font-family: Inter, "Segoe UI", sans-serif;
            background:
                radial-gradient(720px 420px at 20% 20%, rgba(124, 58, 237, 0.16), transparent 62%),
                radial-gradient(540px 320px at 80% 80%, rgba(245, 158, 11, 0.08), transparent 62%),
                linear-gradient(180deg, #09080F, #0F0D17);
        }
        .boot {
            width: min(100%, 420px);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(18, 16, 30, 0.92), rgba(12, 11, 20, 0.94));
            box-shadow: 0 24px 72px rgba(5, 7, 17, 0.28);
            text-align: center;
        }
        .spinner {
            width: 46px;
            height: 46px;
            margin: 0 auto 18px;
            border-radius: 50%;
            border: 3px solid rgba(139, 92, 246, 0.14);
            border-top-color: var(--violet);
            animation: spin 0.9s linear infinite;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 1.1;
            letter-spacing: -0.03em;
        }
        p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.7;
            font-size: 14px;
        }
        .accent {
            color: var(--gold);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="boot">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Ouverture de <span class="accent">Doctor Smile</span></h1>
        <p>Initialisation de l'experience et redirection vers l'interface d'entree.</p>
    </div>
</body>
</html>
