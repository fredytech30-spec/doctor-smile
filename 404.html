<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Non Trouvée</title>
  <meta name="description" content="La page que vous cherchez n'existe pas.">
  <script>
    (function() {
      var t = localStorage.getItem('ds-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/ui-components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      padding: var(--space-24);
    }
    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .code {
      font-family: var(--font-display);
      font-size: 120px;
      line-height: 1;
      font-weight: 800;
      background: linear-gradient(135deg, var(--violet-500), var(--violet-700));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: var(--space-24);
    }
    h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-12);
    }
    p {
      font-size: var(--text-base);
      color: var(--text-secondary);
      margin-bottom: var(--space-32);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Non Trouvée</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <a href="intro.html" class="btn btn-primary">
      <i class="fa-solid fa-house mr-2"></i>
      Retour à l'accueil
    </a>
  </div>
</body>
</html>
