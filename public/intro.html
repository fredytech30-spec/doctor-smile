<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doctor Smile v4</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #010508; font-family: 'Syne', sans-serif; cursor: none; }

#three-canvas { position: fixed; inset: 0; z-index: 1; }
#ecgCanvas    { position: fixed; left: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity 0.4s; }

#overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}

/* ── LOGO ── */
#logo {
  display: flex; align-items: baseline;
  perspective: 1400px;
  transform-style: preserve-3d;
  position: relative;
}

.char {
  display: inline-block;
  font-weight: 900;
  font-size: clamp(56px, 8vw, 116px);
  opacity: 0;
  transform:
    translate3d(var(--fx,0px), var(--fy,0px), var(--fz,-1000px))
    rotateX(var(--rx,80deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg));
  animation: charIn var(--dur,1.3s) var(--delay,0s) cubic-bezier(0.22,1,0.36,1) forwards,
             glowPulse 3.5s calc(var(--delay,0s) + 1.1s) ease-in-out infinite;
  will-change: transform, opacity, filter;
  filter: blur(10px);
}
.char.ice  { color: #7DD3FC; --glow: rgba(125,211,252,0.9); }
.char.gold { color: #FFD700; --glow: rgba(255,215,0,0.9); }

@keyframes charIn {
  0%   { opacity:0; filter:blur(14px);
         transform: translate3d(var(--fx,0px),var(--fy,0px),var(--fz,-1000px))
                    rotateX(var(--rx,80deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,0deg)); }
  55%  { opacity:1; filter:blur(0); }
  78%  { transform: translate3d(calc(var(--fx)*-0.04),calc(var(--fy)*-0.04),18px)
                    rotateX(calc(var(--rx)*-0.04)) rotateY(0) rotateZ(0); }
  100% { opacity:1; filter:blur(0);
         transform: translate3d(0,0,0) rotateX(0) rotateY(0) rotateZ(0);
         text-shadow: 0 0 26px var(--glow), 0 0 80px var(--glow); }
}
@keyframes glowPulse {
  0%,100% { text-shadow: 0 0 18px var(--glow); }
  50%     { text-shadow: 0 0 55px var(--glow), 0 0 120px var(--glow); }
}

.spc { display: inline-block; width: clamp(12px,1.8vw,28px); }

/* ── V4 BADGE ── */
#v4 {
  position: absolute; top: -0.28em; right: -1.9em;
  font-size: 0.21em; font-weight: 800; letter-spacing: 0.09em;
  color: #FFD700;
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.42);
  padding: 3px 8px; border-radius: 3px;
  opacity: 0; transform: scale(0.4) translateY(8px);
  transition: all 0.6s cubic-bezier(0.34,1.56,0.64,1);
  animation: v4Shine 2.6s 1s ease-in-out infinite;
}
#v4.show { opacity: 1; transform: scale(1) translateY(0); }
@keyframes v4Shine {
  0%,100% { box-shadow: 0 0 6px rgba(255,215,0,0.25); }
  50%     { box-shadow: 0 0 22px rgba(255,215,0,0.8); }
}

/* ── TAGLINE ── */
#tagline {
  font-size: clamp(9px, 1.05vw, 13px); font-weight: 400;
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(125,211,252,0.5);
  margin-top: 1.2rem;
  opacity: 0; clip-path: inset(0 100% 0 0);
  transition: clip-path 1.5s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
}
#tagline.show { opacity: 1; clip-path: inset(0 0% 0 0); }

/* ── METRICS ── */
#metrics {
  display: flex; gap: clamp(22px,4.5vw,68px);
  margin-top: 2.5rem;
  opacity: 0; transform: translateY(26px) scale(0.96);
  transition: opacity 1s ease, transform 1s cubic-bezier(0.34,1.2,0.64,1);
}
#metrics.show { opacity: 1; transform: translateY(0) scale(1); }
.metric { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.mval {
  font-size: clamp(22px,3vw,40px); font-weight: 900; color: #7DD3FC; line-height: 1;
  text-shadow: 0 0 18px rgba(125,211,252,0.6);
}
.mval.g { color: #FFD700; text-shadow: 0 0 18px rgba(255,215,0,0.6); }
.mlbl { font-size: clamp(7px,0.75vw,10px); letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.28); }

/* ── ENTER BUTTON ── */
#enterBtn {
  position: fixed; bottom: 8vh; left: 50%;
  transform: translateX(-50%) translateY(36px);
  z-index: 20; opacity: 0; pointer-events: none;
  transition: opacity 1s ease, transform 1s cubic-bezier(0.34,1.56,0.64,1);
}
#enterBtn.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: all; }
#enterBtn button {
  font-family: 'Syne', sans-serif; font-size: clamp(10px,0.95vw,12px);
  font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase;
  color: #010508;
  background: linear-gradient(135deg, #7DD3FC 0%, #38BDF8 40%, #0EA5E9 60%, #7DD3FC 100%);
  background-size: 300% 100%;
  border: none; border-radius: 2px; cursor: pointer;
  padding: clamp(13px,1.4vw,18px) clamp(28px,4vw,58px);
  animation: btnFlow 2.6s ease infinite;
  position: relative; overflow: hidden;
  transition: transform 0.2s;
}
@keyframes btnFlow {
  0%   { background-position:100% 0;  box-shadow: 0 0 22px rgba(125,211,252,0.3); }
  50%  { background-position:0% 0;    box-shadow: 0 0 55px rgba(125,211,252,0.8); }
  100% { background-position:-100% 0; box-shadow: 0 0 22px rgba(125,211,252,0.3); }
}
#enterBtn button:hover { transform: scale(1.06); }
#enterBtn button::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
  transform:translateX(-100%);
  animation: sweep 2.6s ease infinite;
}
@keyframes sweep { 100%{ transform:translateX(200%); } }

/* ── CORNERS ── */
.corner {
  position: fixed; z-index: 8; width: 42px; height: 42px; opacity: 0;
  transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.34,1.56,0.64,1);
}
.corner.show { opacity: 1; transform: scale(1) !important; }
.corner.tl { top:20px;    left:20px;  border-top:1px solid rgba(125,211,252,0.4); border-left:1px solid rgba(125,211,252,0.4);  transform:scale(0.3); transform-origin:top left; }
.corner.tr { top:20px;    right:20px; border-top:1px solid rgba(125,211,252,0.4); border-right:1px solid rgba(125,211,252,0.4); transform:scale(0.3); transform-origin:top right; }
.corner.bl { bottom:20px; left:20px;  border-bottom:1px solid rgba(125,211,252,0.4); border-left:1px solid rgba(125,211,252,0.4); transform:scale(0.3); transform-origin:bottom left; }
.corner.br { bottom:20px; right:20px; border-bottom:1px solid rgba(125,211,252,0.4); border-right:1px solid rgba(125,211,252,0.4); transform:scale(0.3); transform-origin:bottom right; }

/* ── STATUS ── */
#status {
  position: fixed; bottom: 3vh; left: 50%; transform: translateX(-50%);
  font-size: 8px; letter-spacing: 0.26em; text-transform: uppercase;
  color: rgba(125,211,252,0.2); z-index: 12; opacity: 0; transition: opacity 0.6s;
  white-space: nowrap;
}
#status.show { opacity: 1; }

/* ── PROGRESS ── */
#progress { position:fixed; bottom:0; left:0; right:0; height:2px; z-index:50; background:rgba(255,255,255,0.04); }
#prog-bar {
  height:100%; width:0%;
  background: linear-gradient(90deg, #7DD3FC, #FFD700, #7DD3FC);
  background-size:200% 100%;
  box-shadow: 0 0 10px rgba(125,211,252,0.8);
  animation: progShine 1.6s linear infinite;
  transition: width 0.12s ease;
}
@keyframes progShine { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── SCAN LINE ── */
.scanline {
  position:fixed; left:0; right:0; height:1px; z-index:5; pointer-events:none;
  background: linear-gradient(90deg, transparent, rgba(125,211,252,0.22), transparent);
  animation: scanAnim 9s linear infinite;
}
@keyframes scanAnim { 0%{top:-1px;opacity:.8} 100%{top:100vh;opacity:0} }

/* ── FLASH ── */
#flash {
  position:fixed; inset:0; z-index:200;
  background: radial-gradient(ellipse at center, #38BDF8 0%, #010508 70%);
  opacity:0; pointer-events:none; transition:opacity 0.7s ease;
}

/* ── CURSOR ── */
#cur  { position:fixed; width:8px; height:8px; border-radius:50%; background:#7DD3FC; pointer-events:none; z-index:999; transform:translate(-50%,-50%); mix-blend-mode:screen; }
#curR { position:fixed; width:30px; height:30px; border-radius:50%; border:1px solid rgba(125,211,252,0.4); pointer-events:none; z-index:998; transform:translate(-50%,-50%); transition:left .14s ease, top .14s ease; }

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVE MOBILE — Doctor Smile Intro
   Breakpoints : 768px (tablette) · 480px (téléphone) · 360px (petit)
   JS Three.js original conservé 100% intact — patches CSS uniquement
═══════════════════════════════════════════════════════════════════ */

/* ── Curseur désactivé sur touch ── */
@media (hover:none) and (pointer:coarse) {
  html, body { cursor: auto; }
  #cur, #curR { display: none; }
}

/* ════════════════════════════════════════
   TABLETTE ≤ 768px
════════════════════════════════════════ */
@media (max-width: 768px) {

  /* Overflow scroll autorisé (contenu peut être plus grand que viewport) */
  html, body { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100%; }

  /* Overlay : relatif + scroll naturel */
  #overlay {
    position: relative;
    min-height: 100svh;
    padding: 10vh 24px 200px;   /* espace pour le bouton fixe en bas */
    justify-content: center;
  }

  /* Logo : légèrement réduit pour ne pas trop déborder */
  .char { font-size: clamp(44px, 7.2vw, 116px); }
  .spc  { width: clamp(8px, 1.4vw, 28px); }

  /* V4 badge : on le colle plus près */
  #v4 { right: -2.1em; font-size: 0.19em; }

  /* Tagline : letter-spacing réduit pour ne pas déborder */
  #tagline {
    font-size: clamp(8px, 1.2vw, 11px);
    letter-spacing: 0.2em;
    text-align: center;
    max-width: 90vw;
  }

  /* Metrics : gap adaptatif */
  #metrics { gap: clamp(16px, 3.5vw, 44px); }

  /* Bouton : width contrôlée */
  #enterBtn { width: min(88vw, 360px); }
  #enterBtn button {
    width: 100%;
    font-size: 11px;
    letter-spacing: 0.22em;
    padding: 15px 28px;
  }

  /* Status : wrap autorisé */
  #status {
    white-space: normal;
    text-align: center;
    max-width: 80vw;
    font-size: 7px;
    letter-spacing: 0.18em;
    bottom: 10px;
  }

  /* Corners réduits */
  .corner { width: 28px; height: 28px; }
  .corner.tl { top: 14px; left: 14px; }
  .corner.tr { top: 14px; right: 14px; }
  .corner.bl { bottom: 14px; left: 14px; }
  .corner.br { bottom: 14px; right: 14px; }
}

/* ════════════════════════════════════════
   TÉLÉPHONE ≤ 480px — LA PÉPITE
════════════════════════════════════════ */
@media (max-width: 480px) {

  html, body { overflow-x: hidden; overflow-y: auto; height: auto; }

  /* Fond mobile : dégradé riche + grain, pas de WebGL lourd → on le laisse
     mais on ajoute un backdrop CSS pour quand Three.js est lent au démarrage */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 100% 60% at 50% -5%, rgba(125,211,252,0.09) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 55%,  rgba(255,215,0,0.05) 0%, transparent 55%),
      #010508;
    pointer-events: none;
  }

  /* Overlay centré, avec safe-area */
  #overlay {
    position: relative;
    min-height: 100svh;
    padding:
      max(56px, env(safe-area-inset-top, 20px) + 40px)
      20px
      max(180px, env(safe-area-inset-bottom, 20px) + 160px);
    justify-content: center;
    gap: 0;
  }

  /* ── LOGO : taille parfaitement calculée ── */
  /* clamp(23px, 7.2vw, 116px) :
     320px → 23px → logo ≈176px ✓
     375px → 27px → logo ≈207px ✓
     414px → 30px → logo ≈229px ✓
     480px → 35px → logo ≈265px ✓  */
  .char {
    font-size: clamp(23px, 7.2vw, 116px);
  }
  .spc { width: clamp(4px, 1.4vw, 12px); }

  /* Badge v4 : repositionné pour ne pas fuir */
  #v4 {
    position: absolute;
    top: -0.35em;
    right: -2.4em;
    font-size: 0.17em;
    padding: 2px 5px;
    letter-spacing: 0.07em;
  }

  /* ── TAGLINE : 2 lignes confortables ── */
  #tagline {
    font-size: clamp(7.5px, 2vw, 10px);
    letter-spacing: 0.12em;
    text-align: center;
    max-width: 88vw;
    line-height: 2.1;
    margin-top: 1rem;
    /* Afficher les séparateurs · sur 2 lignes si besoin */
    word-break: break-word;
    hyphens: none;
  }

  /* ── METRICS : grille 2×2 glassmorphism ── */
  #metrics {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    row-gap: 0;
    margin-top: 1.8rem;
    width: min(90vw, 320px);
  }
  .metric {
    padding: 14px 12px 12px;
    margin: 4px;
    background: rgba(7, 12, 24, 0.72);
    border: 1px solid rgba(125, 211, 252, 0.13);
    border-radius: 14px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    position: relative; overflow: hidden;
    /* Reflet fin en haut */
    box-shadow: 0 1px 0 rgba(125,211,252,0.12) inset;
  }
  .metric::before {
    content: '';
    position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(125,211,252,0.22), transparent);
  }
  .mval   { font-size: clamp(20px, 5.8vw, 30px); }
  .mlbl   { font-size: clamp(6.5px, 1.7vw, 8.5px); letter-spacing: 0.13em; text-align: center; }

  /* ── BOUTON ENTER : pleine largeur, tactile ── */
  #enterBtn {
    bottom: max(22px, env(safe-area-inset-bottom, 16px) + 16px);
    width: min(90vw, 340px);
  }
  #enterBtn button {
    width: 100%;
    font-size: 12px;
    letter-spacing: 0.20em;
    padding: 17px 28px;
    border-radius: 5px;
    box-shadow: 0 8px 40px rgba(56,189,248,0.4), 0 0 0 1px rgba(255,255,255,0.05) inset;
    min-height: 54px;
  }
  #enterBtn button:active { transform: scale(0.97); }

  /* ── STATUS : wrap + centré ── */
  #status {
    white-space: normal;
    text-align: center;
    max-width: 82vw;
    font-size: 7px;
    letter-spacing: 0.14em;
    bottom: max(8px, env(safe-area-inset-bottom, 8px) + 4px);
    line-height: 1.8;
  }

  /* ── COINS réduits ── */
  .corner { width: 20px; height: 20px; }
  .corner.tl { top: 10px; left: 10px; }
  .corner.tr { top: 10px; right: 10px; }
  .corner.bl { bottom: 10px; left: 10px; }
  .corner.br { bottom: 10px; right: 10px; }

  /* ECG : hauteur réduite, centré */
  #ecgCanvas { height: 120px !important; }
}

/* ════════════════════════════════════════
   TRÈS PETIT ≤ 360px (Galaxy S8, iPhone SE…)
════════════════════════════════════════ */
@media (max-width: 360px) {
  .char { font-size: clamp(20px, 6.8vw, 116px); }
  .spc  { width: 3px; }
  #tagline { font-size: 7px; letter-spacing: 0.09em; }
  #metrics { width: min(94vw, 300px); }
  .metric  { padding: 12px 8px 10px; border-radius: 12px; }
  .mval    { font-size: 18px; }
  .mlbl    { font-size: 6px; }
  #v4      { right: -2.7em; font-size: 0.16em; }
  #enterBtn button { font-size: 11px; letter-spacing: 0.16em; padding: 15px 20px; }
}
</style>
</head>
<body>

<div id="cur"></div>
<div id="curR"></div>
<div class="scanline"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div id="progress"><div id="prog-bar"></div></div>

<canvas id="three-canvas"></canvas>
<canvas id="ecgCanvas"></canvas>

<div id="overlay">
  <div id="logo">
    <span class="char ice" style="--fx:-1100px;--fy:-380px;--fz:-900px;--rx:110deg;--ry:-55deg;--rz:28deg;--delay:.08s;--dur:1.45s">D</span>
    <span class="char ice" style="--fx:820px;--fy:550px;--fz:-1200px;--rx:-85deg;--ry:45deg;--rz:-22deg;--delay:.20s;--dur:1.35s">o</span>
    <span class="char ice" style="--fx:-540px;--fy:900px;--fz:-700px;--rx:70deg;--ry:75deg;--rz:35deg;--delay:.32s;--dur:1.3s">c</span>
    <span class="char ice" style="--fx:1050px;--fy:-280px;--fz:-1100px;--rx:-65deg;--ry:-48deg;--rz:-18deg;--delay:.44s;--dur:1.4s">t</span>
    <span class="char ice" style="--fx:-780px;--fy:-650px;--fz:-800px;--rx:95deg;--ry:32deg;--rz:42deg;--delay:.56s;--dur:1.32s">o</span>
    <span class="char ice" style="--fx:620px;--fy:720px;--fz:-1300px;--rx:-78deg;--ry:-65deg;--rz:-32deg;--delay:.68s;--dur:1.42s">r</span>
    <span class="spc"></span>
    <span class="char gold" style="--fx:-680px;--fy:480px;--fz:-1400px;--rx:115deg;--ry:58deg;--rz:-38deg;--delay:.88s;--dur:1.52s">S</span>
    <span class="char gold" style="--fx:960px;--fy:-520px;--fz:-950px;--rx:-95deg;--ry:-42deg;--rz:27deg;--delay:1.02s;--dur:1.44s">m</span>
    <span class="char gold" style="--fx:-1150px;--fy:210px;--fz:-650px;--rx:72deg;--ry:82deg;--rz:-24deg;--delay:1.16s;--dur:1.36s">i</span>
    <span class="char gold" style="--fx:420px;--fy:-860px;--fz:-1050px;--rx:-105deg;--ry:-28deg;--rz:44deg;--delay:1.30s;--dur:1.4s">l</span>
    <span class="char gold" style="--fx:-320px;--fy:950px;--fz:-1250px;--rx:82deg;--ry:-62deg;--rz:-28deg;--delay:1.44s;--dur:1.48s">e</span>
    <span id="v4">v4</span>
  </div>

  <div id="tagline">Médecin IA · Santé Financière · ML Ensemble · SHAP Explicable</div>

  <div id="metrics">
    <div class="metric"><div class="mval" id="m1">0%</div><div class="mlbl">Précision IA</div></div>
    <div class="metric"><div class="mval g" id="m2">0</div><div class="mlbl">Modèles Ensemble</div></div>
    <div class="metric"><div class="mval" id="m3">0ms</div><div class="mlbl">Temps Analyse</div></div>
    <div class="metric"><div class="mval g" id="m4">0</div><div class="mlbl">Ratios Financiers</div></div>
  </div>
</div>

<div id="enterBtn">
  <button onclick="launchApp()">Lancer Doctor Smile →</button>
</div>
<div id="status">Système initialisé · Modèles chargés · Prêt</div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
const lerp    = (a,b,t) => a + (b-a)*t;
const clamp   = (v,a,b) => Math.max(a, Math.min(b, v));
const r01     = (t,s,e) => clamp((t-s)/(e-s), 0, 1);
const eOut3   = t => 1 - Math.pow(1-t, 3);
const eOut4   = t => 1 - Math.pow(1-t, 4);
const eInOut  = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

// ═══════════════════════════════════════
// THREE SETUP
// ═══════════════════════════════════════
const cvs = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas:cvs, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x010508, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x010508, 0.016);
const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 22);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  resizeEcg();
});

// ═══════════════════════════════════════
// BACKGROUND DUST  (standard PointsMaterial — no shader)
// ═══════════════════════════════════════
const DUST = 3200;
const dPosArr = new Float32Array(DUST*3);
const dColArr = new Float32Array(DUST*3);
for(let i=0;i<DUST;i++){
  dPosArr[i*3]   = (Math.random()-.5)*55;
  dPosArr[i*3+1] = (Math.random()-.5)*35;
  dPosArr[i*3+2] = (Math.random()-.5)*35;
  const g = Math.random()>.72;
  dColArr[i*3]   = g ? 1.0 : .49;
  dColArr[i*3+1] = g ? .84 : .83;
  dColArr[i*3+2] = g ? 0.0 : .99;
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPosArr, 3));
dGeo.setAttribute('color',    new THREE.BufferAttribute(dColArr, 3));
const dMat  = new THREE.PointsMaterial({ size:.055, vertexColors:true, transparent:true, opacity:.28, sizeAttenuation:true, depthWrite:false });
const dustM = new THREE.Points(dGeo, dMat);
scene.add(dustM);

// ═══════════════════════════════════════
// SMILE TARGETS  — arc opens UPWARD (sin is negative = arc on top)
// ═══════════════════════════════════════
const SMILE_N = 340;

function buildSmileTargets() {
  const pts = [];
  for(let i=0;i<SMILE_N;i++){
    const t   = i/(SMILE_N-1);
    // angle sweeps from ~200° to ~340°  → top arc (opening upward like ☺)
    const ang = Math.PI * (1.15 + t * 0.7);   // 207° → 333°
    const rx  = 5.6, ry = 2.5;
    const z   = Math.sin(t * Math.PI * 3) * .16; // depth wave
    pts.push(new THREE.Vector3(
      rx * Math.cos(ang),
      1.6 + ry * Math.sin(ang),   // +1.6 = centres it slightly above mid
      z
    ));
  }
  return pts;
}
const smileT = buildSmileTargets();

// ═══════════════════════════════════════
// SMILE PARTICLES  — standard PointsMaterial (NO custom shader = no compile error)
// ═══════════════════════════════════════
const sPosArr = new Float32Array(SMILE_N*3);
const sColArr = new Float32Array(SMILE_N*3);
const origins = [];

for(let i=0;i<SMILE_N;i++){
  const phi = Math.random()*Math.PI*2;
  const tht = Math.random()*Math.PI;
  const r   = 10 + Math.random()*22;
  const ox  = r*Math.sin(tht)*Math.cos(phi);
  const oy  = r*Math.sin(tht)*Math.sin(phi);
  const oz  = r*Math.cos(tht) - 4;
  origins.push(new THREE.Vector3(ox,oy,oz));
  sPosArr[i*3]=ox; sPosArr[i*3+1]=oy; sPosArr[i*3+2]=oz;

  const t = i/SMILE_N;
  sColArr[i*3]   = .45 + t*.28;
  sColArr[i*3+1] = .82 - t*.06;
  sColArr[i*3+2] = .99 - t*.10;
}

const sGeo = new THREE.BufferGeometry();
sGeo.setAttribute('position', new THREE.BufferAttribute(sPosArr, 3));
sGeo.setAttribute('color',    new THREE.BufferAttribute(sColArr, 3));

const sMat = new THREE.PointsMaterial({
  size: .18,
  vertexColors: true,
  transparent: true,
  opacity: .9,
  sizeAttenuation: true,
  depthWrite: false,
});
const smilePts = new THREE.Points(sGeo, sMat);
scene.add(smilePts);

// ═══════════════════════════════════════
// SMILE ARC TUBE  (CatmullRomCurve3 + TubeGeometry)
// ═══════════════════════════════════════
const thinned = smileT.filter((_,i) => i%3===0);
const curve   = new THREE.CatmullRomCurve3(thinned);

const arcGeo  = new THREE.TubeGeometry(curve, 160, .022, 8, false);
const arcMat  = new THREE.MeshBasicMaterial({ color:0x38BDF8, transparent:true, opacity:0 });
const arcMesh = new THREE.Mesh(arcGeo, arcMat);

const hGeo  = new THREE.TubeGeometry(curve, 160, .12, 8, false);
const hMat  = new THREE.MeshBasicMaterial({ color:0x0EA5E9, transparent:true, opacity:0 });
const hMesh = new THREE.Mesh(hGeo, hMat);

scene.add(arcMesh);
scene.add(hMesh);

// ═══════════════════════════════════════
// CONNECTION LINES between smile particles
// ═══════════════════════════════════════
let conLines = null;
(function(){
  const verts=[];
  for(let i=0;i<SMILE_N;i++) for(let j=i+1;j<SMILE_N;j++){
    if(smileT[i].distanceTo(smileT[j]) < 1.2){
      verts.push(smileT[i].x,smileT[i].y,smileT[i].z,
                 smileT[j].x,smileT[j].y,smileT[j].z);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts),3));
  const m = new THREE.LineBasicMaterial({ color:0x7DD3FC, transparent:true, opacity:0, linewidth:1 });
  conLines = new THREE.LineSegments(g,m);
  scene.add(conLines);
})();

// ═══════════════════════════════════════
// ORBITAL TORUS RINGS
// ═══════════════════════════════════════
function mkTorus(R,t,col,op,rx,ry){
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(R,t,16,120),
    new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:op })
  );
  m.rotation.x=rx; m.rotation.y=ry; scene.add(m); return m;
}
const ring1 = mkTorus(8.0,.012,0x7DD3FC,.08, .38,.22);
const ring2 = mkTorus(6.2,.009,0xFFD700,.06,-.55,.51);
const ring3 = mkTorus(9.5,.007,0x38BDF8,.05, 1.05,-.32);

// ═══════════════════════════════════════
// HOLOGRAPHIC GRID PLANE  (simple LineSegments, no shader)
// ═══════════════════════════════════════
(function(){
  const verts=[], STEP=1.5, RANGE=16;
  for(let x=-RANGE;x<=RANGE;x+=STEP){ verts.push(x,-4.5,-RANGE, x,-4.5,RANGE); }
  for(let z=-RANGE;z<=RANGE;z+=STEP){ verts.push(-RANGE,-4.5,z, RANGE,-4.5,z); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts),3));
  const m = new THREE.LineBasicMaterial({ color:0x0EA5E9, transparent:true, opacity:.06 });
  scene.add(new THREE.LineSegments(g,m));
})();

// ═══════════════════════════════════════
// RENDER LOOP  — cinematic timeline
// ═══════════════════════════════════════
let mx=0, my=0;
document.addEventListener('mousemove', e => {
  mx = (e.clientX/window.innerWidth  - .5)*2;
  my = (e.clientY/window.innerHeight - .5)*2;
});
// Touch parallax
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mx = (t.clientX/window.innerWidth  - .5)*2;
  my = (t.clientY/window.innerHeight - .5)*2;
}, { passive: true });

let rStart=null;
const RDUR = 6400;

function renderLoop(ts){
  requestAnimationFrame(renderLoop);
  if(!rStart) rStart=ts;
  const T = Math.min((ts-rStart)/RDUR, 1);

  // ── ACT 1: Camera pull-in (T 0→0.18)
  camera.position.z = 22 - eOut4(r01(T,.0,.18))*10; // 22→12

  // ── ACT 2: Particles converge into smile (T 0.12→0.60)
  const a2 = eInOut(r01(T,.12,.60));
  const pA = sGeo.attributes.position.array;
  for(let i=0;i<SMILE_N;i++){
    const delay = (i/SMILE_N)*.28;
    const pt    = clamp((a2 - delay*a2)/(1-delay), 0, 1);
    const e     = eOut3(pt);
    pA[i*3]   = lerp(origins[i].x, smileT[i].x, e);
    pA[i*3+1] = lerp(origins[i].y, smileT[i].y, e);
    pA[i*3+2] = lerp(origins[i].z, smileT[i].z, e);
  }
  sGeo.attributes.position.needsUpdate = true;

  // size pulse using time — simulated without shader
  sMat.size = .18 + .06*Math.sin(ts*.002);

  // ── ACT 3: Arc tube reveal (T 0.50→0.76)
  arcMat.opacity = eOut3(r01(T,.50,.76)) * .92;
  hMat.opacity   = eOut3(r01(T,.50,.76)) * .14;

  // ── ACT 4: Connection lines (T 0.63→0.86)
  if(conLines) conLines.material.opacity = eOut3(r01(T,.63,.86)) * .38;

  // ── Rings
  ring1.rotation.z += .0008; ring1.rotation.x += .0002;
  ring2.rotation.z -= .0006; ring2.rotation.y += .0003;
  ring3.rotation.x += .0004; ring3.rotation.z += .0001;

  // ── Dust drift
  dustM.rotation.y += .00018;
  dustM.rotation.x += .00008;

  // ── Mouse/touch parallax (after T>0.28)
  if(T>.28){
    camera.position.x = lerp(camera.position.x, mx*1.8, .035);
    camera.position.y = lerp(camera.position.y, -my*.9, .035);
    smilePts.rotation.y = lerp(smilePts.rotation.y, mx*.07, .028);
    smilePts.rotation.x = lerp(smilePts.rotation.x, my*.03, .028);
    arcMesh.rotation.copy(smilePts.rotation);
    hMesh.rotation.copy(smilePts.rotation);
    if(conLines) conLines.rotation.copy(smilePts.rotation);
  }

  // ── Smile gentle float
  if(T>.55){
    const fy = Math.sin(ts*.00076)*.12;
    smilePts.position.y=fy; arcMesh.position.y=fy;
    hMesh.position.y=fy;
    if(conLines) conLines.position.y=fy;
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(renderLoop);

// ═══════════════════════════════════════
// ECG CANVAS
// ═══════════════════════════════════════
const ecgCvs = document.getElementById('ecgCanvas');
const ecgCtx = ecgCvs.getContext('2d');
let ecgStart = null;
const ECG_DUR = 2700;

function resizeEcg(){
  ecgCvs.width  = window.innerWidth;
  ecgCvs.height = 160;
  ecgCvs.style.width  = window.innerWidth+'px';
  ecgCvs.style.height = '160px';
  ecgCvs.style.top    = (window.innerHeight/2 - 80)+'px';
}
resizeEcg();

function drawEcg(ts){
  if(!ecgStart) ecgStart=ts;
  const et  = ts - ecgStart;
  const fwd = Math.min(et/ECG_DUR, 1);
  ecgCvs.style.opacity = fwd<.1 ? String(fwd*10) : fwd>.82 ? String((1-fwd)/.18) : '1';

  const W=ecgCvs.width, MID=80;
  ecgCtx.clearRect(0,0,W,160);

  const xS=W*.06, xE=W*.94, drawn=(xE-xS)*fwd;

  const grad = ecgCtx.createLinearGradient(xS,0,xE,0);
  grad.addColorStop(0,'rgba(56,189,248,0)');
  grad.addColorStop(.15,'rgba(56,189,248,.9)');
  grad.addColorStop(.5,'rgba(125,211,252,1)');
  grad.addColorStop(.85,'rgba(56,189,248,.9)');
  grad.addColorStop(1,'rgba(255,215,0,.7)');

  ecgCtx.save();
  ecgCtx.beginPath();
  ecgCtx.strokeStyle = grad;
  ecgCtx.lineWidth   = 2.2;
  ecgCtx.shadowColor = 'rgba(56,189,248,.7)';
  ecgCtx.shadowBlur  = 16;

  let first=true;
  for(let px=0;px<=drawn;px+=1.4){
    const x=xS+px, rel=px/(xE-xS);
    let y=MID;

    if     (rel<.07)  { /* flat */ }
    else if(rel<.11)  { const s=(rel-.07)/.04;  y=MID-s*9; }
    else if(rel<.15)  { const s=(rel-.11)/.04;  y=MID-9+s*9; }
    else if(rel<.20)  { /* flat */ }
    else if(rel<.24)  { const s=(rel-.20)/.04;  y=MID+s*14; }
    else if(rel<.26)  { const s=(rel-.24)/.02;  y=MID+14-s*14; }
    else if(rel<.31)  { /* flat */ }
    else if(rel<.35)  { const s=(rel-.31)/.04;  y=MID-s*18; }
    else if(rel<.375) { const s=(rel-.35)/.025; y=MID-18-s*58; }   // QRS spike UP
    else if(rel<.41)  { const s=(rel-.375)/.035;y=MID-76+s*96; }   // deep dip
    else if(rel<.44)  { const s=(rel-.41)/.03;  y=MID+20-s*20; }
    else if(rel<.50)  { /* flat */ }
    else if(rel<.58)  { const s=(rel-.50)/.08;  y=MID-Math.sin(s*Math.PI)*30; } // T-wave
    else if(rel<.62)  { /* flat */ }
    else {
      // morphs ECG → sinusoid → evokes the smile arc
      const s=(rel-.62)/.38;
      const fr=1.2+s*2.2, am=14+s*28;
      y = MID + Math.sin(s*Math.PI*fr*2)*am;
    }
    if(first){ ecgCtx.moveTo(x,y); first=false; } else ecgCtx.lineTo(x,y);
  }
  ecgCtx.stroke();

  // tip glow + arrow
  const tipX=xS+drawn, relT=drawn/(xE-xS);
  let tipY=MID;
  if(relT>.62){ const s=(relT-.62)/.38; tipY=MID+Math.sin(s*Math.PI*(1.2+s*2.2)*2)*(14+s*28); }

  ecgCtx.beginPath();
  ecgCtx.arc(tipX,tipY,5,0,Math.PI*2);
  ecgCtx.fillStyle='rgba(56,189,248,.95)';
  ecgCtx.shadowBlur=28; ecgCtx.fill();

  ecgCtx.beginPath();
  ecgCtx.fillStyle='rgba(56,189,248,.88)';
  ecgCtx.moveTo(tipX+16,tipY);
  ecgCtx.lineTo(tipX+2,tipY-7);
  ecgCtx.lineTo(tipX+2,tipY+7);
  ecgCtx.closePath(); ecgCtx.fill();

  ecgCtx.restore();

  if(fwd<1) requestAnimationFrame(drawEcg);
  else setTimeout(()=>{ ecgCvs.style.opacity='0'; }, 300);
}

// ═══════════════════════════════════════
// COUNTERS + PROGRESS
// ═══════════════════════════════════════
function counter(el,to,sfx,dur){
  const s=performance.now();
  (function step(ts){
    const p=Math.min((ts-s)/dur,1), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(e*to)+sfx;
    if(p<1) requestAnimationFrame(step);
    else el.textContent=to+sfx;
  })(s);
}

let pv=0;
function prog(to,dur,cb){
  const s=performance.now(), from=pv;
  (function step(ts){
    const p=Math.min((ts-s)/dur,1);
    pv=from+(to-from)*(1-Math.pow(1-p,2));
    document.getElementById('prog-bar').style.width=pv+'%';
    if(p<1) requestAnimationFrame(step);
    else{ pv=to; if(cb) cb(); }
  })(s);
}

// ═══════════════════════════════════════
// MASTER TIMELINE
// ═══════════════════════════════════════
prog(18,500);

setTimeout(()=>{                         // T+300
  document.querySelectorAll('.corner').forEach(c=>c.classList.add('show'));
  prog(44,900);
},300);

setTimeout(()=>{                         // T+650: ECG
  ecgCvs.style.opacity='.01';
  requestAnimationFrame(drawEcg);
  prog(66,1800);
},650);

setTimeout(()=>{ document.getElementById('v4').classList.add('show'); prog(82,400); }, 2900);
setTimeout(()=>{ document.getElementById('tagline').classList.add('show'); prog(91,500); }, 3300);

setTimeout(()=>{                         // T+3900: metrics
  document.getElementById('metrics').classList.add('show');
  counter(document.getElementById('m1'),95,'%',1900);
  counter(document.getElementById('m2'),12,'',1500);
  counter(document.getElementById('m3'),340,'ms',1300);
  counter(document.getElementById('m4'),87,'',1700);
  prog(100,500);
},3900);

setTimeout(()=>{                         // T+5100: enter + status
  document.getElementById('enterBtn').classList.add('show');
  document.getElementById('status').classList.add('show');
},5100);

// ═══════════════════════════════════════
// CURSOR — désactivé sur touch
// ═══════════════════════════════════════
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (!isTouchDevice) {
  const cur  = document.getElementById('cur');
  const curR = document.getElementById('curR');
  let cx=0, cy=0;
  document.addEventListener('mousemove', e=>{
    cx=e.clientX; cy=e.clientY;
    cur.style.left=cx+'px'; cur.style.top=cy+'px';
  });
  setInterval(()=>{ curR.style.left=cx+'px'; curR.style.top=cy+'px'; }, 14);
}

  document.getElementById('flash').style.opacity='1';
