<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Financier - Doctor Smile</title>
  <link rel="stylesheet" href="assets/css/design-system.css">
  <link rel="stylesheet" href="assets/css/ui-components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .chatbot-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 1000;
    }
    .chatbot-toggle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--violet-3);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .chatbot-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 24px rgba(109, 78, 219, 0.4);
    }
    .chatbot-window {
      position: absolute;
      bottom: 80px;
      right: 0;
      width: 400px;
      max-width: calc(100vw - 2rem);
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .chatbot-window.open {
      display: flex;
    }
    .chatbot-header {
      background: var(--violet-3);
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chatbot-header h3 {
      margin: 0;
      font-size: 1rem;
    }
    .chatbot-close {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 1.25rem;
    }
    .chatbot-messages {
      flex: 1;
      max-height: 400px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .chat-message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
    }
    .chat-message.user {
      align-self: flex-end;
      background: var(--violet-3);
      color: white;
    }
    .chat-message.bot {
      align-self: flex-start;
      background: var(--bg);
      color: var(--text-1);
    }
    .chat-message.typing {
      align-self: flex-start;
      background: var(--bg);
      padding: 0.5rem 1rem;
    }
    .typing-dots {
      display: flex;
      gap: 0.25rem;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }
    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }
    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-4px);
      }
    }
    .message-time {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 0.25rem;
    }
    .chatbot-input-area {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }
    .chatbot-form {
      display: flex;
      gap: 0.5rem;
    }
    .chatbot-input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text-1);
    }
    .chatbot-send {
      background: var(--violet-3);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .quick-suggestions {
      padding: 0.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .suggestion-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .suggestion-btn:hover {
      background: var(--violet-bg);
    }
  </style>
</head>
<body>
  <div class="chatbot-container">
    <div id="chatbot-window" class="chatbot-window">
      <div class="chatbot-header">
        <h3>🤖 Chatbot Financier</h3>
        <button class="chatbot-close" onclick="toggleChatbot()">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div id="chatbot-messages" class="chatbot-messages">
        <div class="chat-message bot">
          <div class="message-content">Bonjour ! Je suis votre assistant financier. Posez-moi des questions sur votre liquidité, endettement, rentabilité ou score de vulnérabilité.</div>
        </div>
      </div>
      <div id="quick-suggestions" class="quick-suggestions"></div>
      <div class="chatbot-input-area">
        <form id="chatbot-form" class="chatbot-form">
          <input type="text" id="chatbot-input" class="chatbot-input" placeholder="Posez votre question...">
          <button type="submit" class="chatbot-send">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
    <button id="chatbot-toggle" class="chatbot-toggle" onclick="toggleChatbot()">
      <i class="fa-solid fa-comments"></i>
    </button>
  </div>
  
  <script type="module" src="./js/ds-chatbot.js"></script>
  <script type="module" src="./js/ds-core.js"></script>
</body>
</html>
